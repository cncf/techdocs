    color: '696969'
  - name: p0-critical
    color: 'B60205'
  - name: p1-high
    color: 'D93F0B'
  - name: p2-medium
    color: 'FBCA04'
  - name: p3-low
    color: 'FEF2C0'
  - name: e0-minutes
    description: 'Effort: < 60 min'
    color: 'e6ccb3'
  - name: e1-hours
    description: 'Effort: < 8 hrs'
    color: 'd9b38c'
  - name: e2-days
    description: 'Effort: < 5 days'
    color: 'cc9966'
  - name: e3-weeks
    description: 'Effort: < 4 weeks'
    color: 'bf8040'
  - name: e4-months
    description: 'Effort: 1+ months'
